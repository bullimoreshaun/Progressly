<style>
  :root{
    --bg: #F5F5F5;
    --surface: #FFFFFF;
    --ink: #000000;
    --ink-soft: #4A4A4A;
    --line: #DDDDDD;
    --teal: #333333;
    --teal-deep: #000000;
    --teal-tint: #ECECEC;
    --plum: #8B4562;
    --plum-tint: #F3E5EA;
    --amber: #A6803B;
    --amber-tint: #F2E9D6;
    --danger: #AA3333;
    --danger-tint: #FBEAEA;
    --emphasis-bg: #000000;
    --emphasis-text: #FFFFFF;
    --overlay: rgba(20,20,20,0.5);
    --overlay-strong: rgba(15,15,15,0.84);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.07), 0 6px 20px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"]{
    --bg: #121212;
    --surface: #1E1E1E;
    --ink: #F5F5F5;
    --ink-soft: #A8A8A8;
    --line: #333333;
    --teal: #8A8A8A;
    --teal-deep: #4A4A4A;
    --teal-tint: #262626;
    --plum: #C97A9A;
    --plum-tint: #3A2530;
    --amber: #D9B36A;
    --amber-tint: #3A301C;
    --danger: #E28787;
    --danger-tint: #3A2323;
    --emphasis-bg: #F5F5F5;
    --emphasis-text: #121212;
    --overlay: rgba(0,0,0,0.6);
    --overlay-strong: rgba(0,0,0,0.88);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
  }
  html{ background:var(--bg); }
  html[data-theme="dark"] .wordmark img.mark{ filter:invert(1); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background-color 0.2s ease, color 0.2s ease;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  /* ---------- Layout shell ---------- */
  #app{ max-width:960px; margin:0 auto; padding:0 20px 80px; }
  header.top{ padding:28px 0 0; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .wordmark{ display:flex; align-items:center; gap:12px; }
  .wordmark img.mark{ width:36px; height:auto; display:block; }
  .wordmark .word-text{ display:flex; align-items:baseline; gap:10px; }
  .wordmark h1{ font-size:28px; color:var(--ink); }
  .wordmark span.tag{ font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em; text-transform:uppercase;}
  .theme-toggle{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .theme-toggle:hover{ background:var(--teal-tint); }

  /* Week ribbon — signature element */
  .ribbon-wrap{ margin:20px 0 10px; padding:16px 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .ribbon{ display:flex; gap:6px; }
  .ribbon .cell{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--teal-tint); border:1px solid transparent; }
  .ribbon .cell.today{ background:var(--surface); color:var(--ink); font-weight:700; border:2px solid var(--ink); }
  .ribbon .cell.dose-day{ border-color:var(--plum); color:var(--ink); font-weight:600; }
  .ribbon-meta{ font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .ribbon-meta strong{ color:var(--ink); font-weight:600; }

  /* Tabs */
  nav.tabs{ display:flex; gap:4px; margin:22px 0 22px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.tabs button{ background:none; border:none; padding:10px 14px; font-size:14px; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap; }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--teal-deep); font-weight:600; }
  nav.tabs button:hover{ color:var(--ink); }

  /* Cards / grid */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:720px){ .grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .card .label{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .card .value{ font-family:'Fraunces',serif; font-size:30px; margin-top:6px; color:var(--ink); }
  .card .value small{ font-size:14px; font-family:'IBM Plex Sans',sans-serif; color:var(--ink-soft); font-weight:400; }
  .card .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink); }
  .pill.pos{ background:var(--teal-tint); }
  .pill.warn{ background:var(--amber-tint); }
  .pill.plum{ background:var(--plum-tint); }

  section{ margin-top:30px; }
  section > h2{ font-size:19px; margin-bottom:12px; color:var(--ink); }

  /* Forms */
  .entry-form{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.03em; }
  .field input, .field select, .field textarea{ padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--surface); color:var(--ink); }
  .field textarea{ resize:vertical; min-height:38px; }
  .btn{ padding:10px 16px; border-radius:8px; border:1px solid var(--teal-deep); background:var(--teal-deep); color:#fff; font-size:13.5px; font-weight:500; }
  .btn:hover{ background:var(--teal); border-color:var(--teal); }
  .btn.secondary{ background:var(--surface); color:var(--ink); }
  .btn.secondary:hover{ background:var(--teal-tint); }
  .btn.danger{ background:var(--surface); color:var(--danger); border-color:var(--danger); }
  .btn.danger:hover{ background:var(--danger-tint); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* Log list */
  .log-list{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .log-row{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; gap:10px; }
  .log-row .main{ display:flex; flex-direction:column; gap:2px; }
  .log-row .date{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .log-row .title{ font-size:14.5px; font-weight:500; }
  .log-row .note{ font-size:12.5px; color:var(--ink-soft); }
  .log-row .actions{ display:flex; gap:6px; }
  .icon-btn{ background:none; border:none; color:var(--ink-soft); font-size:16px; padding:4px 6px; border-radius:6px; }
  .icon-btn:hover{ background:var(--plum-tint); color:var(--ink); }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:var(--radius); font-size:14px; }
  .empty strong{ display:block; color:var(--ink); font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-bottom:4px; }

  /* Photos */
  .photo-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .upload-btn{ position:relative; overflow:hidden; }
  .upload-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .photo-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); }
  .photo-card img{ width:100%; height:150px; object-fit:cover; display:block; background:var(--teal-tint); }
  .photo-card .meta{ padding:8px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .photo-card .meta .d{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .photo-card .meta .w{ font-size:13px; font-weight:500; margin-top:2px; }
  .photo-card .edit-photo-btn{ background:none; border:none; color:var(--ink-soft); font-size:14px; padding:2px 5px; border-radius:6px; line-height:1; flex-shrink:0; }
  .photo-card .edit-photo-btn:hover{ background:var(--plum-tint); color:var(--ink); }
  .photo-card.selected{ outline:2px solid var(--plum); }

  .compare-wrap{ display:flex; gap:14px; flex-wrap:wrap; }
  .compare-col{ flex:1; min-width:220px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); }
  .compare-col img{ width:100%; border-radius:8px; display:block; }
  .compare-col .cap{ margin-top:8px; font-size:13px; color:var(--ink-soft); }

  /* Lightbox */
  .lightbox{ position:fixed; inset:0; background:var(--overlay-strong); display:flex; align-items:center; justify-content:center; z-index:50; padding:30px; }
  .lightbox img{ max-width:min(700px,90vw); max-height:80vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  .lightbox .close{ position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:26px; }
  .lightbox .cap{ position:absolute; bottom:26px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px; text-align:center; }

  /* Onboarding modal */
  .modal-backdrop{ position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .modal{ background:var(--surface); border-radius:18px; padding:30px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .modal h2{ font-size:22px; color:var(--ink); margin-bottom:6px; }
  .modal p.sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5; }
  .modal .field{ margin-bottom:12px; }
  .modal .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Weight trend chart */
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .chart-wrap{ overflow:visible; }
  .chart-tooltip{
    position:absolute; transform:translate(-50%,-115%); pointer-events:none; opacity:0;
    transition:opacity 0.1s ease; background:var(--emphasis-bg); color:var(--emphasis-text); border-radius:8px;
    padding:6px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,0.18); z-index:5;
  }
  .chart-tooltip.tt-left{ transform:translate(-10%,-115%); }
  .chart-tooltip.tt-right{ transform:translate(-90%,-115%); }
  .chart-tooltip .tt-date{ font-size:10px; opacity:0.75; }
  .chart-tooltip .tt-weight{ font-weight:600; font-size:13px; }
  .range-toggle{ display:flex; gap:6px; margin-bottom:14px; }
  .range-toggle button{ background:var(--teal-tint); border:1px solid transparent; color:var(--ink); padding:5px 12px; border-radius:20px; font-size:12.5px; }
  .range-toggle button.active{ background:var(--teal-deep); color:#fff; }

  footer.appfoot{ text-align:center; margin-top:50px; font-size:12px; color:var(--ink-soft); }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--emphasis-bg); color:var(--emphasis-text); padding:10px 18px; border-radius:20px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:70; }
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin-top:100px;">Loading Progressly…</div></div>

<script>
(function(){

  const WEEKDAYS = ['S','M','T','W','T','F','S'];
  const state = {
    tab: 'dashboard',
    theme: 'light',
    profile: null,
    doses: [],
    weights: [],
    photosIndex: [],
    photoCache: {},
    compareSel: [],
    trendRange: 'all',
    loaded: false
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(s){
    const d = new Date(s+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }
  function fmtShort(s){
    const d = new Date(s+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  function unitLabel(){ return state.profile && state.profile.unit === 'kg' ? 'kg' : 'lb'; }

  // ---------- Local storage backend (IndexedDB) ----------
  // Standalone/PWA build: replaces the Claude-artifact-only window.storage API
  // with real on-device persistence via IndexedDB, behind the same tiny
  // {get,set,delete} interface so nothing else in the app has to change.
  const DB_NAME = 'progressly-db';
  const STORE_NAME = 'kv';
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)){ reject(new Error('IndexedDB unsupported')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  const localStorageBackend = {
    async get(key){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = ()=> resolve(req.result !== undefined ? { key, value: req.result } : null);
        req.onerror = ()=> reject(req.error);
      });
    },
    async set(key, value){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = ()=> resolve({ key, value });
        tx.onerror = ()=> reject(tx.error);
      });
    },
    async delete(key){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(key);
        tx.oncomplete = ()=> resolve({ key, deleted: true });
        tx.onerror = ()=> reject(tx.error);
      });
    }
  };

  async function sGet(key, shared){
    try{
      const r = await localStorageBackend.get(key);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  async function sSet(key, value, shared){
    try{
      const r = await localStorageBackend.set(key, value);
      return !!r;
    }catch(e){ console.error('storage set failed', key, e); return false; }
  }
  async function sDelete(key, shared){
    try{ await localStorageBackend.delete(key); return true; }
    catch(e){ return false; }
  }
  async function getJSON(key){
    const v = await sGet(key,false);
    if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  }
  async function setJSON(key,obj){ return sSet(key, JSON.stringify(obj), false); }

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }

  // ---------- Theme ----------
  async function setTheme(theme){
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    await sSet('theme', theme, false);
  }

  // ---------- Load ----------
  async function loadAll(){
    const [profile, doses, weights, photosIndex] = await Promise.all([
      getJSON('profile'),
      getJSON('doses'),
      getJSON('weights'),
      getJSON('photos-index')
    ]);
    state.profile = profile;
    state.doses = doses || [];
    state.weights = weights || [];
    state.photosIndex = photosIndex || [];
    state.loaded = true;
  }

  async function ensurePhoto(id){
    if(state.photoCache[id]) return state.photoCache[id];
    const v = await sGet('photo:'+id, false);
    if(v) state.photoCache[id] = v;
    return v;
  }

  // ---------- Derived data ----------
  function sortedDoses(){ return [...state.doses].sort((a,b)=> b.date.localeCompare(a.date)); }
  function sortedWeights(){ return [...state.weights].sort((a,b)=> b.date.localeCompare(a.date)); }
  function weightsAsc(){ return [...state.weights].sort((a,b)=> a.date.localeCompare(b.date)); }

  function latestWeight(){ const w = sortedWeights(); return w.length ? w[0] : null; }
  function startWeightVal(){
    if(state.profile && state.profile.startWeight != null && state.profile.startWeight !== '') return parseFloat(state.profile.startWeight);
    const w = weightsAsc(); return w.length ? parseFloat(w[0].weight) : null;
  }
  function lastDose(){ const d = sortedDoses(); return d.length ? d[0] : null; }
  function nextDoseDate(){
    const ld = lastDose();
    if(!ld) return null;
    const d = new Date(ld.date+'T00:00:00');
    d.setDate(d.getDate()+7);
    return d.toISOString().slice(0,10);
  }
  function doseWeekday(){
    const ld = lastDose();
    if(!ld) return null;
    return new Date(ld.date+'T00:00:00').getDay();
  }

  // ---------- Render shell ----------
  function tabButton(id,label){
    return `<button data-tab="${id}" class="${state.tab===id?'active':''}">${label}</button>`;
  }

  function renderRibbon(){
    const today = new Date();
    const todayIdx = today.getDay();
    const dw = doseWeekday();
    let cells = '';
    for(let i=0;i<7;i++){
      const classes = ['cell'];
      if(i===todayIdx) classes.push('today');
      if(dw!==null && i===dw) classes.push('dose-day');
      cells += `<div class="${classes.join(' ')}">${WEEKDAYS[i]}</div>`;
    }
    const nd = nextDoseDate();
    let meta = 'Log your first dose to start tracking your weekly rhythm.';
    if(nd){
      const diff = Math.round((new Date(nd+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/DAY_MS);
      if(diff > 0) meta = `Next dose due <strong>${fmtShort(nd)}</strong> · in ${diff} day${diff===1?'':'s'}`;
      else if(diff === 0) meta = `Dose due <strong>today</strong>`;
      else meta = `Dose was due <strong>${fmtShort(nd)}</strong> · ${Math.abs(diff)} day${Math.abs(diff)===1?'':'s'} ago`;
    }
    return `<div class="ribbon-wrap">
      <div class="ribbon">${cells}</div>
      <div class="ribbon-meta">${meta}</div>
    </div>`;
  }

  function shell(inner){
    const app = document.getElementById('app');
    app.innerHTML = `
      <header class="top">
        <div class="top-row">
          <div class="wordmark">
            <img class="mark" src="data:image/png;base64,${ICON_MARK_B64}" alt="Progressly icon" width="36" height="35">

              <h1>Progressly</h1>
              <span class="tag">GLP‑1 tracker</span>
            </div>
          </div>
          <button class="theme-toggle" id="themeToggle" title="Switch to ${state.theme==='dark'?'light':'dark'} theme" aria-label="Switch to ${state.theme==='dark'?'light':'dark'} theme">${state.theme==='dark'?'☀':'☾'}</button>
        </div>
        ${renderRibbon()}
        <nav class="tabs">
          ${tabButton('dashboard','Dashboard')}
          ${tabButton('log','Log')}
          ${tabButton('photos','Photos')}
          ${tabButton('settings','Settings')}
        </nav>

  function computeStreak(){
    const doses = sortedDoses();
    if(!doses.length) return 0;
    // bucket doses into ISO weeks
    const weeks = new Set();
    doses.forEach(d=>{
      const dt = new Date(d.date+'T00:00:00');
      const onejan = new Date(dt.getFullYear(),0,1);
      const week = Math.ceil((((dt-onejan)/DAY_MS) + onejan.getDay()+1)/7);
      weeks.add(dt.getFullYear()+'-'+week);
    });
    // count back from most recent week
    const sortedWeeks = [...weeks].sort().reverse();
    let streak = 1;
    for(let i=0;i<sortedWeeks.length-1;i++){
      // simple contiguous count heuristic
      streak++;
      if(i>50) break;
    }
    return Math.min(streak, weeks.size);
  }

  function resizeImage(file, maxDim, quality){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('decode failed'));
        img.onload = ()=>{
          let {width,height} = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
            else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Weight trend (Dashboard) ----------
  function filteredWeights(){
    const asc = weightsAsc();
    if(state.trendRange==='all') return asc;
    const days = {'1m':30,'3m':90,'6m':180}[state.trendRange];
    const cutoff = Date.now() - days*DAY_MS;
    return asc.filter(w => new Date(w.date+'T00:00:00').getTime() >= cutoff);
  }

  function drawWeightChartInto(containerId, data, height){
    const holder = document.getElementById(containerId);
    if(!holder) return;
    height = height || 260;
    if(data.length < 2){
      holder.innerHTML = `<div class="empty"><strong>Not enough data yet</strong>Log at least two weigh‑ins to see your trend line.</div>`;
      return;
    }
    const W = 640, H = height, pad = 36;
    const vals = data.map(d=>parseFloat(d.weight));
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const xStep = (W - pad*2) / (data.length-1);
    const points = data.map((d,i)=>{
      const x = pad + i*xStep;
      const y = H - pad - ((parseFloat(d.weight)-min)/range) * (H-pad*2);
      return [x,y];
    });
    const path = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const area = path + ` L${points[points.length-1][0].toFixed(1)},${H-pad} L${points[0][0].toFixed(1)},${H-pad} Z`;

    const dots = points.map((p,i)=>
      `<circle class="chart-dot" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--teal-deep)" pointer-events="none"/>`
    ).join('');
    const hitTargets = points.map((p,i)=>
      `<circle class="chart-hit" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="12" fill="transparent" style="cursor:pointer;"/>`
    ).join('');
    const firstLbl = fmtShort(data[0].date), lastLbl = fmtShort(data[data.length-1].date);

    holder.innerHTML = `
      <div class="chart-wrap" style="position:relative;">
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Weight trend chart">
          <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
          <path d="${area}" fill="var(--teal-tint)" stroke="none"/>
          <path d="${path}" fill="none" stroke="var(--teal-deep)" stroke-width="2.2"/>
          <line class="chart-guide" x1="0" y1="${pad-14}" x2="0" y2="${H-pad}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
          ${dots}
          <circle class="chart-dot-active" r="4.6" fill="var(--teal-deep)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
          ${hitTargets}
          <text x="${pad}" y="${H-10}" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${firstLbl}</text>
          <text x="${W-pad}" y="${H-10}" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace" text-anchor="end">${lastLbl}</text>
          <text x="${pad}" y="16" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${max.toFixed(1)} ${unitLabel()}</text>
          <text x="${pad}" y="${H-pad-4}" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${min.toFixed(1)} ${unitLabel()}</text>
        </svg>
        <div class="chart-tooltip"></div>
      </div>`;

    const wrap = holder.querySelector('.chart-wrap');
    const svg = holder.querySelector('svg');
    const tooltip = holder.querySelector('.chart-tooltip');
    const guide = holder.querySelector('.chart-guide');
    const activeDot = holder.querySelector('.chart-dot-active');

    function showPoint(i){
      const [x,y] = points[i];
      guide.setAttribute('x1', x.toFixed(1));
      guide.setAttribute('x2', x.toFixed(1));
      guide.setAttribute('opacity', '1');
      activeDot.setAttribute('cx', x.toFixed(1));
      activeDot.setAttribute('cy', y.toFixed(1));
      activeDot.setAttribute('opacity', '1');
      tooltip.innerHTML = `<div class="tt-date">${fmtDate(data[i].date)}</div><div class="tt-weight">${vals[i].toFixed(1)} ${unitLabel()}</div>`;
      tooltip.style.opacity = '1';
      const pct = x / W;
      tooltip.style.left = `${pct*100}%`;
      tooltip.style.top = `${(y/H)*100}%`;
      tooltip.classList.toggle('tt-right', pct > 0.72);
      tooltip.classList.toggle('tt-left', pct < 0.28);
    }
    function hidePoint(){
      guide.setAttribute('opacity', '0');
      activeDot.setAttribute('opacity', '0');
      tooltip.style.opacity = '0';
    }

    holder.querySelectorAll('.chart-hit').forEach(hit=>{
      const i = +hit.dataset.i;
      hit.addEventListener('mouseenter', ()=> showPoint(i));
      hit.addEventListener('focus', ()=> showPoint(i));
      hit.addEventListener('mouseleave', hidePoint);
      hit.addEventListener('blur', hidePoint);
    });
    svg.addEventListener('touchstart', (e)=>{
      const touch = e.touches[0];
      const rect = svg.getBoundingClientRect();
      const relX = (touch.clientX - rect.left) / rect.width * W;
      let nearest = 0, best = Infinity;
      points.forEach((p,i)=>{ const d = Math.abs(p[0]-relX); if(d<best){ best=d; nearest=i; } });
      showPoint(nearest);
    }, {passive:true});
  }

  // ---------- Settings tab ----------
  function renderSettings(){
    const p = state.profile || {};
    shell(`

        <h2>Profile</h2>
        <div class="entry-form" id="settingsForm" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">

            <select name="medication">
              ${['Ozempic','Wegovy','Mounjaro','Zepbound','Trulicity','Rybelsus','Other'].map(m=>`<option ${p.medication===m?'selected':''}>${m}</option>`).join('')}
            </select>

          <div class="field"><label>Start date</label><input type="date" name="startDate" value="${p.startDate||todayStr()}"></div>
          <div class="field"><button class="btn" type="button" id="saveSettingsBtn">Save profile</button></div>
        </div>
      </section>
      <section>
        <h2>Import data</h2>
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div class="label">Progressly backup</div>
            <div class="sub">Restore a .json file exported from Progressly (this device or another one).</div>
          </div>
          <button class="btn secondary upload-btn">Import backup<input type="file" id="importJsonInput" accept="application/json,.json"></button>
        </div>
        <div class="card" style="margin-top:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div class="label">Weigh‑ins from another app</div>
            <div class="sub">Import a .csv with date and weight columns — works with exports from most scales and tracking apps.</div>
          </div>
          <button class="btn secondary upload-btn">Import CSV<input type="file" id="importCsvInput" accept=".csv,text/csv"></button>
        </div>
      </section>
      <section>
        <h2>Your data</h2>
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div class="label">Export</div>
            <div class="sub">Download everything you've logged as a JSON file.</div>
          </div>
          <button class="btn secondary" id="exportBtn">Export data</button>
        </div>
        <div class="card" style="margin-top:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div class="label">Clear all data</div>
            <div class="sub">Removes every dose, weigh‑in, and photo. This can't be undone.</div>

    `);

    document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
      const f = readFields(document.getElementById('settingsForm'));
      state.profile = {
        medication: f.medication,
        unit: f.unit,
        startWeight: f.startWeight,

      };
      await setJSON('profile', state.profile);

    document.getElementById('importCsvInput').addEventListener('change', handleImportCsv);

      for(const p of state.photosIndex){
        const data = await ensurePhoto(p.id);
        photos.push({...p, dataUrl:data});
      }
      const payload = { profile: state.profile, doses: state.doses, weights: state.weights, photos };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      await setJSON('weights', []);

  // ---------- Import ----------
  function readFileText(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = ()=>resolve(reader.result);
      reader.readAsText(file);
    });
  }

  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function pad2(n){ n = String(n); return n.length < 2 ? '0'+n : n; }

  function parseFlexibleDate(str){
    if(!str) return null;
    str = str.trim();
    let m = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
    m = str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m) return `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
    m = str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2})$/);
    if(m) return `20${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
    const d = new Date(str);
    if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
    return null;
  }

  function parseWeightNum(str){
    if(str == null) return null;
    const cleaned = String(str).replace(/[^0-9.]/g,'');
    if(!cleaned) return null;
    const v = parseFloat(cleaned);
    return isNaN(v) ? null : v;
  }

  function kgToLb(kg){ return kg*2.2046226218; }

  function localDateFromIso(isoStr, tz){
    if(!isoStr) return null;
    const d = new Date(isoStr);
    if(isNaN(d.getTime())) return String(isoStr).slice(0,10) || null;
    try{
      if(tz){
        const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit' });
        return fmt.format(d);
      }
    }catch(err){ /* unknown tz string, fall through */ }
    return d.toISOString().slice(0,10);
  }

  // Adapts exports from other GLP-1 tracking apps (different field names,
  // metric weights, ISO timestamps) into Progressly's own {doses, weights,
  // profile} shape so they can go through the same merge logic below.
  function normalizeForeignBackup(data){
    const tz = data.profile && data.profile.timezone;
    const targetUnit = (state.profile && state.profile.unit === 'kg') ? 'kg'
      : (state.profile ? 'lb'
      : ((data.profile && data.profile.unit_system === 'metric') ? 'kg' : 'lb'));

    const doses = (data.injections||[]).filter(Boolean).map(inj => ({
      date: localDateFromIso(inj.injected_at, tz),
      medication: inj.medication || '',
      dose: inj.dose_mg != null ? String(inj.dose_mg) : '',
      site: inj.site || '',
      note: inj.notes || ''
    })).filter(d => d.date);

    const weights = (data.weights||[]).filter(Boolean).map(w => {
      if(w.weight_kg == null) return null;
      const val = Math.round((targetUnit==='lb' ? kgToLb(w.weight_kg) : w.weight_kg)*10)/10;
      return { date: w.recorded_on, weight: val, note: w.notes || '' };
    }).filter(w => w && w.date);

    let profile = null;
    if(data.profile || data.medicationPlan){
      const sw = data.profile && data.profile.starting_weight_kg;
      const gw = data.profile && data.profile.goal_weight_kg;
      profile = {
        medication: (data.medicationPlan && data.medicationPlan.medication) || '',
        unit: targetUnit,
        startWeight: sw != null ? String(Math.round((targetUnit==='lb'?kgToLb(sw):sw)*10)/10) : '',
        goalWeight: gw != null ? String(Math.round((targetUnit==='lb'?kgToLb(gw):gw)*10)/10) : '',
        startDate: (data.medicationPlan && data.medicationPlan.start_date) || todayStr()
      };
    }

    const photosSkipped = Array.isArray(data.photos) ? data.photos.filter(p => p && !p.dataUrl).length : 0;

    return { doses, weights, photos: [], profile, photosSkipped };
  }

  async function handleImportBackup(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    let raw;
    try{
      const text = await readFileText(file);
      raw = JSON.parse(text);
    }catch(err){
      toast("Couldn't read that file — is it a Progressly backup?");
      return;
    }

    let data = raw, foreignPhotosSkipped = 0;
    if(!Array.isArray(raw.doses) && Array.isArray(raw.injections)){
      const n = normalizeForeignBackup(raw);
      data = { doses: n.doses, weights: n.weights, photos: n.photos, profile: n.profile };
      foreignPhotosSkipped = n.photosSkipped;
    }

    let addedDoses = 0, addedWeights = 0, addedPhotos = 0;

    if(Array.isArray(data.doses)){
      const existingKeys = new Set(state.doses.map(d => `${d.date}|${d.medication}|${d.dose}|${d.site}`));
      for(const d of data.doses){
        if(!d || !d.date) continue;
        const key = `${d.date}|${d.medication}|${d.dose}|${d.site}`;
        if(existingKeys.has(key)) continue;
        existingKeys.add(key);
        state.doses.push({ id: uid(), date: d.date, medication: d.medication||'', dose: d.dose||'', site: d.site||'', note: d.note||'' });
        addedDoses++;
      }
    }

    if(Array.isArray(data.weights)){
      const existingKeys = new Set(state.weights.map(w => `${w.date}|${parseFloat(w.weight)}`));
      for(const w of data.weights){
        if(!w || !w.date || w.weight == null) continue;
        const key = `${w.date}|${parseFloat(w.weight)}`;
        if(existingKeys.has(key)) continue;
        existingKeys.add(key);
        state.weights.push({ id: uid(), date: w.date, weight: w.weight, note: w.note||'' });
        addedWeights++;
      }
    }

    if(Array.isArray(data.photos)){
      const existingKeys = new Set(state.photosIndex.map(p => `${p.date}|${p.weight}|${p.note}`));
      for(const p of data.photos){
        if(!p || !p.date || !p.dataUrl) continue;
        const key = `${p.date}|${p.weight||''}|${p.note||''}`;
        if(existingKeys.has(key)) continue;
        existingKeys.add(key);
        const newId = uid();
        await sSet('photo:'+newId, p.dataUrl, false);
        state.photosIndex.push({ id: newId, date: p.date, weight: p.weight||'', note: p.note||'' });
        state.photoCache[newId] = p.dataUrl;
        addedPhotos++;
      }
    }

    if(!state.profile && data.profile){
      state.profile = data.profile;
      await setJSON('profile', state.profile);
    }

    await setJSON('doses', state.doses);
    await setJSON('weights', state.weights);
    await setJSON('photos-index', state.photosIndex);

    const parts = [];
    if(addedDoses || addedWeights || addedPhotos){
      parts.push(`Imported ${addedDoses} dose${addedDoses===1?'':'s'}, ${addedWeights} weigh-in${addedWeights===1?'':'s'}, ${addedPhotos} photo${addedPhotos===1?'':'s'}`);
    }else{
      parts.push('Nothing new to import — that data is already here');
    }
    if(foreignPhotosSkipped){
      parts.push(`${foreignPhotosSkipped} photo${foreignPhotosSkipped===1?'':'s'} couldn't be imported — the file only linked to the old app's storage, not the actual image`);
    }
    toast(parts.join('. '));
    render();
  }

  async function handleImportCsv(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    let text;
    try{ text = await readFileText(file); }
    catch(err){ toast("Couldn't read that file"); return; }

    const rows = parseCSV(text);
    if(rows.length < 2){ toast('That CSV looks empty'); return; }

    // Some apps export multiple tables into one CSV (section label rows like
    // "INJECTIONS" / "WEIGHT" separating them) — scan for the row that actually
    // looks like a date+weight header rather than assuming row 0 is it.
    let headerRow = -1, dateIdx = -1, weightIdx = -1;
    for(let i=0;i<rows.length;i++){
      const cells = rows[i].map(h=>h.trim());
      const dIdx = cells.findIndex(h => /date/i.test(h));
      const wIdx = cells.findIndex(h => /weight/i.test(h));
      if(dIdx !== -1 && wIdx !== -1){ headerRow = i; dateIdx = dIdx; weightIdx = wIdx; break; }
    }
    if(headerRow === -1){
      toast("Couldn't find date and weight columns in that CSV");
      return;
    }

    const sourceIsKg = /kg/i.test(rows[headerRow][weightIdx]);
    const targetIsKg = state.profile && state.profile.unit === 'kg';

    function isSectionLabel(row){
      const nonEmpty = row.filter(c=>c.trim()!=='');
      return nonEmpty.length===1 && /^[A-Z_ ]+$/.test(nonEmpty[0].trim());
    }

    const existingKeys = new Set(state.weights.map(w => `${w.date}|${parseFloat(w.weight)}`));
    let added = 0, skipped = 0;
    for(const row of rows.slice(headerRow+1)){
      if(isSectionLabel(row)) break;
      const date = parseFlexibleDate(row[dateIdx]);
      let weight = parseWeightNum(row[weightIdx]);
      if(!date || weight == null){ skipped++; continue; }
      if(sourceIsKg && !targetIsKg) weight = Math.round(weight*2.2046226218*10)/10;
      else if(!sourceIsKg && targetIsKg) weight = Math.round((weight/2.2046226218)*10)/10;
      const key = `${date}|${weight}`;
      if(existingKeys.has(key)){ skipped++; continue; }
      existingKeys.add(key);
      state.weights.push({ id: uid(), date, weight, note: '' });
      added++;
    }

    await setJSON('weights', state.weights);
    toast(added ? `Imported ${added} weigh-in${added===1?'':'s'}${skipped?`, skipped ${skipped}`:''}` : "No new weigh-ins found in that file");
    render();
  }

  // ---------- Onboarding ----------
  function renderOnboarding(){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>Welcome to Progressly</h2>
        <p class="sub">Set a few basics so your dashboard and weekly rhythm line up from day one.</p>
        <div id="onboardForm">
          <div class="field"><label>Medication</label>
            <select name="medication">
              <option>Ozempic</option><option>Wegovy</option><option>Mounjaro</option>
              <option>Zepbound</option><option>Trulicity</option><option>Rybelsus</option><option>Other</option>
            </select>
          </div>
          <div class="row2">
            <div class="field"><label>Units</label>
              <select name="unit"><option value="lb">lb</option><option value="kg">kg</option></select>
            </div>
            <div class="field"><label>Starting weight</label><input type="number" step="0.1" name="startWeight" placeholder="Optional"></div>
          </div>
          <div class="field"><label>Goal weight</label><input type="number" step="0.1" name="goalWeight" placeholder="Optional"></div>
          <button class="btn" type="button" id="onboardBtn" style="width:100%; margin-top:6px;">Start tracking</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#onboardBtn').addEventListener('click', async ()=>{
      const f = readFields(backdrop.querySelector('#onboardForm'));
      state.profile = {
        medication: f.medication,
        unit: f.unit,
        startWeight: f.startWeight,
        goalWeight: f.goalWeight,
        startDate: todayStr()
      };
      await setJSON('profile', state.profile);
      backdrop.remove();
      render();
    });
  }

  // ---------- Router ----------
  function render(){
    if(state.tab==='dashboard') renderDashboard();
    else if(state.tab==='log') renderLog();
    else if(state.tab==='photos') renderPhotos();
    else if(state.tab==='settings') renderSettings();
  }

  async function init(){
    const storedTheme = await sGet('theme', false);
    state.theme = storedTheme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    await loadAll();
    // preload photo thumbnails in background
    state.photosIndex.forEach(p=> ensurePhoto(p.id));
    render();
    if(!state.profile){ renderOnboarding(); }
  }

  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
    });
  }
})();
</script>
